<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>BlockScript</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <i class="ti ti-cube"></i> BlockScript
      </div>
    </header>

    <div id="all">
      <div class="panel" id="blocks">
        <h2><i class="ti ti-cubes"></i> Блоки</h2>

        <div class="category">
          <h3><i class="ti ti-variable"></i> Переменные</h3>
          <div class="block yellow" data-type="declare">Объявить переменные</div>
          <div class="block yellow" data-type="array">Объявить массив</div>
        </div>

        <div class="category">
          <h3><i class="ti ti-arrow-right"></i> Операции</h3>
          <div class="block green" data-type="assign">Присвоить</div>
          <div class="block green" data-type="array-assign">Присвоить элементу массива</div>
        </div>

        <div class="category">
          <h3><i class="ti ti-code"></i> Условия</h3>
          <div class="block blue" data-type="if">Если</div>
          <div class="block blue" data-type="ifelse">Если/иначе</div>
        </div>

        <div class="category">
          <h3><i class="ti ti-repeat"></i> Циклы</h3>
          <div class="block purple" data-type="while">Пока</div>
        </div>

        <div class="category">
          <h3><i class="ti ti-brain"></i> Логические</h3>
          <div class="block orange" data-type="condition">Условие</div>
          <div class="block orange" data-type="and">AND</div>
          <div class="block orange" data-type="or">OR</div>
          <div class="block orange" data-type="not">NOT</div>
        </div>

      </div>

      <div class="panel" id="program">
        <h2>Программа</h2>
        <div id="workspace"></div>
        <div id="buttons"> 
          <button id="start">Запустить</button> 
          <button id="clear">Очистить</button>
        </div>
      </div>

      <div class="panel" id="console-panel">
        <h2>Консоль</h2>
        <div id="console"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
